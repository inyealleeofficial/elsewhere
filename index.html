<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>elsewhere — live windows to the world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5F0; --paper2:#EFEEE7; --card:#FFFFFF; --ink:#1C2B24; --ink2:#3E4C45; --muted:#7D867F; --line:#E4E3DB; --line2:#D9D8CF;
  --green:#1F4A3A; --green2:#2C5E4B; --sage:#E3EAE2; --sage2:#CFDCCF; --accent:#E2673A; --live:#3FA06B;
  --r:18px; --shadow:0 1px 2px rgba(28,43,36,.04),0 8px 24px -12px rgba(28,43,36,.18);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;font-weight:700;color:var(--green2)}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:30px 18px 24px;display:flex;flex-direction:column;background:var(--paper)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:27px;letter-spacing:-1px;color:var(--ink);padding:0 6px}
.logo .mark{width:38px;height:38px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.logo .mark svg{width:22px;height:22px;stroke:#fff}
.logo b{color:var(--accent)}
.side .eyebrow{margin:40px 6px 12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:12px;font-weight:600;color:var(--ink2);text-align:left}
.nav-item:hover{background:var(--paper2)}
.nav-item.on{background:var(--sage);color:var(--green)}
.nav-item .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.side hr{border:0;border-top:1px solid var(--line);margin:22px 6px 0}
.clist{overflow:auto;flex:1;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
.crow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:500;font-size:14.5px;text-align:left}
.crow:hover{background:var(--paper2)}
.crow.on{background:var(--sage);color:var(--green);font-weight:700}
.crow code{font-family:inherit;font-size:10px;font-weight:700;color:var(--muted);width:20px}
.crow .n{margin-left:auto;font-size:12px;color:var(--muted)}
.side-foot{padding:18px 6px 0;border-top:1px solid var(--line)}
.side-foot .glob{width:42px;height:42px;color:var(--sage2)}
.side-foot h4{margin:8px 0 4px;font-size:19px;letter-spacing:-.4px}
.side-foot p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}

.main{min-width:0}
.topbar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:13.5px;color:var(--ink2)}
.topbar .tag{display:flex;align-items:center;gap:8px}
.topbar .tag svg{color:var(--accent);width:15px;height:15px}
.topbar .online{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;box-shadow:0 0 0 3px rgba(63,160,107,.18)}
.wrap{max-width:1240px;margin:0 auto;padding:44px 40px 120px}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.head h1{font-size:44px;line-height:1.05;letter-spacing:-1.8px;margin:12px 0 10px;font-weight:800}
.head h1 em{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;letter-spacing:-.5px;color:var(--green2)}
.head p{margin:0;color:var(--ink2);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn.line{border:1px solid var(--line2);background:var(--card)}
.btn.line:hover{border-color:var(--ink2)}
.btn.dark{background:var(--green);color:#fff}
.btn.dark:hover{background:var(--green2)}
.btn.white{background:#fff;color:var(--ink)}

/* hero */
.hero{position:relative;margin-top:30px;border-radius:24px;overflow:hidden;aspect-ratio:2.35/1;min-height:360px;background:#203029;color:#fff;box-shadow:var(--shadow)}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.hero .slide.on{opacity:1}
.hero img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 7s ease-out}
.hero .slide.on img{transform:scale(1)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,24,19,.72) 0%,rgba(14,24,19,.35) 45%,rgba(14,24,19,.05) 75%),linear-gradient(0deg,rgba(14,24,19,.45),transparent 40%);pointer-events:none}
.hero-txt{position:absolute;z-index:2;left:40px;bottom:40px;right:40%}
.chip-glass{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase}
.hero .tl{position:absolute;z-index:2;top:30px;left:34px}
.hero .tr{position:absolute;z-index:2;top:30px;right:30px;letter-spacing:.2px;text-transform:none;font-size:11.5px;font-weight:600}
.coords{font-size:12px;letter-spacing:3px;opacity:.85;font-weight:600}
.hero h2{font-size:50px;letter-spacing:-2px;margin:10px 0 8px;line-height:1.02;font-weight:800}
.hero h2 em{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;letter-spacing:-.5px}
.hero p{margin:0 0 22px;font-size:16.5px;opacity:.92}
.hero .br{position:absolute;z-index:2;right:32px;bottom:30px;text-align:right}
.hero .count{font-size:22px;font-weight:700}
.hero .count small{font-size:13px;opacity:.6;font-weight:500}
.hero .where{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13.5px;font-weight:600}
.hero .dots{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.hero .dots button{width:7px;height:7px;border-radius:9px;background:rgba(255,255,255,.4);transition:.3s}
.hero .dots button.on{width:22px;background:#fff}

/* tools */
.tools{display:flex;gap:14px;margin-top:34px}
.search{flex:1;display:flex;align-items:center;gap:12px;height:58px;padding:0 20px;background:var(--card);border:1px solid var(--line2);border-radius:14px;transition:.15s}
.search:focus-within{border-color:var(--green2);box-shadow:0 0 0 4px rgba(44,94,75,.08)}
.search input{flex:1;border:0;outline:0;background:none;font-size:15.5px;min-width:0}
.search input::placeholder{color:#9AA19B}
.search .hint{font-size:10.5px;letter-spacing:1.6px;color:var(--muted);font-weight:700}
.search .x{display:none;width:26px;height:26px;border-radius:50%;background:var(--paper2);place-items:center}
.search.has .x{display:grid}.search.has .hint{display:none}
.select{position:relative;display:flex;align-items:center;gap:10px;height:58px;padding:0 16px;background:var(--card);border:1px solid var(--line2);border-radius:14px;min-width:200px}
.select select{appearance:none;-webkit-appearance:none;border:0;outline:0;background:none;flex:1;font-weight:600;font-size:14.5px;cursor:pointer;padding-right:18px}
.select .chev{position:absolute;right:14px;pointer-events:none}
.chips{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:12px;background:var(--card);border:1px solid var(--line2);font-weight:600;font-size:14px;color:var(--ink2);transition:.15s}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip .c{font-size:11.5px;opacity:.6;font-weight:700}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:34px 0 22px;padding-top:30px;border-top:1px solid var(--line)}
.sec-h h3{margin:0;font-size:23px;letter-spacing:-.6px;font-weight:800;display:flex;align-items:baseline;gap:14px}
.sec-h h3 small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.groupby{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.groupby select{border:0;background:none;font-weight:700;color:var(--ink);outline:0;cursor:pointer}
.grp{display:flex;align-items:center;gap:12px;margin:34px 0 16px}
.grp h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
.grp span{font-size:12.5px;color:var(--muted)}
.grp .line{flex:1;height:1px;background:var(--line)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;text-align:left}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -22px rgba(28,43,36,.45)}
.ph{position:relative;aspect-ratio:16/11;overflow:hidden;background:linear-gradient(135deg,#dfe7de,#c9d6c9)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;display:block}
.card:hover .ph img{transform:scale(1.04)}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,18,14,.55),transparent 38%);pointer-events:none}
.ph .lv{position:absolute;z-index:2;top:12px;left:12px;display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.92);color:var(--green);font-size:10px;font-weight:800;letter-spacing:1.4px;padding:6px 9px;border-radius:7px}
.ph .lv .dot{width:6px;height:6px}
.ph .heart{position:absolute;z-index:3;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;color:var(--ink)}
.ph .heart.on{color:var(--accent)}
.ph .heart.on svg{fill:var(--accent)}
.ph .time{position:absolute;z-index:2;left:14px;bottom:12px;color:#fff;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.ph .go{position:absolute;z-index:3;right:12px;bottom:10px;display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)}
.ph .go:hover{background:rgba(255,255,255,.28)}
.ph .go svg{width:14px;height:14px}
.cb{padding:16px 20px 0;flex:1;display:flex;flex-direction:column}
.cb .loc{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.cb .loc code{font-family:inherit;font-size:9.5px;font-weight:800;margin-right:4px}
.cb .t{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:10px}
.cb h5{margin:0;font-size:19px;letter-spacing:-.4px;font-weight:800;line-height:1.2}
.cb .t svg{color:var(--muted);margin-top:3px}
.cb p{margin:8px 0 16px;color:var(--ink2);font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin:auto -20px 0;padding:13px 20px;font-size:12.5px;color:var(--ink2);font-weight:600}
.cf span{display:inline-flex;align-items:center;gap:7px}
.cf svg{width:15px;height:15px}
.cf .busy{color:var(--accent)}
.cf .room b{color:var(--live)}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.foot button{text-decoration:underline;color:var(--ink2)}

/* ---------- modal ---------- */
.ovl{position:fixed;inset:0;z-index:50;background:rgba(40,58,48,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s}
.ovl.open{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:51;left:50%;top:50%;width:min(1180px,calc(100vw - 48px));max-height:calc(100vh - 48px);transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);background:var(--paper);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 120px -30px rgba(10,20,15,.55)}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.m-img{position:relative;height:300px;flex:none;background:#203029}
.m-img img{width:100%;height:100%;object-fit:cover}
.m-img::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,18,14,.35),transparent 50%)}
.m-img .chip-glass{position:absolute;z-index:2;left:24px;bottom:22px;text-transform:none;letter-spacing:.2px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.35)}
.m-img .close{position:absolute;z-index:3;top:18px;right:18px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.m-img .play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.m-img .play i{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .2s}
.m-img .play:hover i{transform:scale(1.07)}
.m-img .play i svg{width:26px;height:26px;fill:var(--green);stroke:var(--green);margin-left:4px}
.m-body{display:grid;grid-template-columns:1fr 1fr;min-height:0;flex:1}
.m-left{padding:34px 34px 30px;overflow:auto;border-right:1px solid var(--line)}
.crumb{font-size:11.5px;letter-spacing:2px;font-weight:700;color:var(--ink2);text-transform:uppercase}
.crumb code{font-family:inherit;font-size:9.5px;color:var(--muted);margin-right:6px}
.m-left h2{font-size:38px;letter-spacing:-1.4px;margin:14px 0 14px;line-height:1.05;font-weight:800}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:7px;background:var(--sage);color:var(--green)}
.pill.warm{background:#F7E6DC;color:#A8461F}
.m-left .lead{color:var(--ink2);font-size:15px;line-height:1.6;margin:18px 0 0}
.see{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.see span{font-size:12.5px;padding:5px 10px;border:1px solid var(--line2);border-radius:99px;color:var(--ink2);background:var(--card)}
.host{margin-top:22px;background:var(--sage);border-radius:16px;padding:22px 24px}
.host .eyebrow{color:var(--green2);font-size:10px}
.host h6{margin:8px 0 8px;font-size:19px;font-weight:800;letter-spacing:-.3px}
.host p{margin:0 0 16px;color:var(--ink2);font-size:13.5px;line-height:1.55}
.host small{display:block;margin-top:12px;font-size:11.5px;color:var(--muted)}
.host .row{display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.acts .btn{height:42px;font-size:13.5px;font-weight:600}
.credit{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.5}
.credit button{text-decoration:underline;color:var(--ink2);font-size:11.5px}
.m-right{display:flex;flex-direction:column;min-height:0;padding:30px 30px 22px}
.conv-h{display:flex;align-items:center;justify-content:space-between}
.conv-h h3{margin:0;font-size:20px;display:flex;align-items:center;gap:10px;letter-spacing:-.4px}
.conv-h .eyebrow{font-size:9.5px;color:var(--muted)}
.conv-sub{margin:8px 0 14px;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--paper2);border-radius:11px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .n{font-size:11px;color:var(--muted);font-weight:700}
.seg .live{color:var(--live)}
.me{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.me .av{width:40px;height:40px;border-radius:50%;background:var(--sage);display:grid;place-items:center;color:var(--green)}
.me .eyebrow{font-size:9.5px;color:var(--muted)}
.me b{display:block;font-size:14px;margin-top:3px}
.me button{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--green2)}
.feed{flex:1;overflow:auto;padding:12px 2px;min-height:220px}
.e-state{text-align:center;padding:40px 10px;color:var(--muted);font-size:13px}
.e-state svg{width:34px;height:34px;color:var(--green2)}
.e-state b{display:block;color:var(--green);font-size:16px;margin:12px 0 4px}
.msg{display:flex;gap:10px;padding:10px 0}
.msg .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:var(--green)}
.msg .who{font-size:12.5px;font-weight:800;display:flex;gap:8px;align-items:baseline}
.msg .who small{font-weight:500;color:var(--muted);font-size:11px}
.msg .who .you{font-size:9.5px;letter-spacing:1px;font-weight:800;color:var(--accent)}
.msg p{margin:3px 0 0;font-size:14px;line-height:1.5;color:var(--ink2);overflow-wrap:anywhere}
.msg .ops{display:flex;gap:12px;margin-top:4px}
.msg .ops button{font-size:11px;color:var(--muted);font-weight:600}
.msg .ops button:hover{color:var(--ink)}
.sys{text-align:center;font-size:11.5px;color:var(--muted);padding:6px}
.reacts{display:flex;gap:6px;margin:8px 0 0}
.reacts button{flex:1;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:16px}
.composer{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 16px;margin-top:10px}
.composer input{flex:1;border:0;outline:0;background:none;font-size:14.5px;min-width:0;height:38px}
.composer .send{width:40px;height:40px;border-radius:10px;background:var(--green);color:#fff;display:grid;place-items:center}
.composer .send:disabled{background:var(--sage2)}
.rules{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.45}
.rules svg{width:14px;height:14px;margin-top:1px}
.notice{font-size:12px;color:var(--ink2);background:var(--paper2);border-radius:10px;padding:10px 12px;margin:10px 0 0;line-height:1.45}
.floaty{position:absolute;z-index:4;bottom:30px;font-size:30px;pointer-events:none;animation:floatUp 2.6s ease-out forwards}
@keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-200px);opacity:0}}

/* sheet (small dialogs) */
.sheet{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:calc(100% - 28px);max-height:80%;overflow:auto;background:var(--paper);border-radius:22px;padding:26px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 30px 90px -20px rgba(0,0,0,.5)}
.sheet.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(20,30,25,.35);opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet h3{margin:0 0 6px;font-size:21px;letter-spacing:-.4px}
.sheet p{color:var(--ink2);font-size:13.5px;line-height:1.55;margin:0 0 14px}
.sheet .opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;font-weight:600;font-size:14px}
.sheet input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 14px;font-size:15px;outline:0}
.sheet ul{padding-left:18px;margin:0 0 12px}.sheet li{font-size:13.5px;color:var(--ink2);line-height:1.55;margin-bottom:6px}
.cred{font-size:12px;color:var(--ink2);padding:8px 0;border-bottom:1px solid var(--line);line-height:1.45}
.cred a{text-decoration:underline}
.toast{position:fixed;z-index:90;left:50%;bottom:auto;top:80px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;padding:12px 18px;border-radius:12px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* phone device frame */
html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 20% 0%,#E9EDE4,transparent 60%),radial-gradient(800px 500px at 100% 100%,#EFE6DD,transparent 60%),#E8E7E0}
.device{position:relative;width:100%;max-width:440px;height:100dvh;background:var(--paper);overflow:hidden;transform:translateZ(0)}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media (min-width:600px){.device{height:min(920px,calc(100dvh - 40px));border-radius:46px;box-shadow:0 0 0 10px #1d2420,0 0 0 11px #3a443e,0 40px 100px -20px rgba(20,30,25,.45)}}
/* mobile nav */
.mtop,.mnav{display:none}

/* ---------- responsive ---------- */

@media all{
  .shell{grid-template-columns:1fr}
  .side,.topbar{display:none}
  .mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;justify-content:space-between;padding:calc(12px + var(--safe-t)) 18px 12px;background:rgba(246,245,240,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .mtop .logo{font-size:22px;padding:0}.mtop .logo .mark{width:32px;height:32px}.mtop .logo .mark svg{width:18px;height:18px}
  .mtop .ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center}
  .wrap{padding:22px 18px calc(110px + var(--safe-b))}
  .head{align-items:flex-start;flex-direction:column}
  .head h1{font-size:33px;letter-spacing:-1.2px}
  .head p{font-size:14.5px}
  .head .btn{display:none}
  .hero{aspect-ratio:4/5;min-height:0;border-radius:20px;margin-top:20px}
  .hero::after{background:linear-gradient(0deg,rgba(14,24,19,.82) 0%,rgba(14,24,19,.25) 55%,rgba(14,24,19,.15) 100%)}
  .hero-txt{left:22px;right:22px;bottom:24px}
  .hero h2{font-size:34px;letter-spacing:-1.2px}
  .hero p{font-size:14.5px;margin-bottom:16px}
  .hero .tl{top:18px;left:18px}.hero .tr{display:none}
  .hero .br{top:18px;right:18px;bottom:auto}
  .hero .where{display:none}
  .tools{flex-direction:column;gap:10px;margin-top:22px}
  .search,.select{height:52px;flex:none;width:100%}
  .hero{aspect-ratio:4/4.6}
  .search .hint{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:16px -18px 0;padding:0 18px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:42px}
  .sec-h{margin:26px 0 16px;padding-top:22px}
  .sec-h h3{font-size:20px}
  .grid{grid-template-columns:1fr;gap:18px}
  .mnav{display:flex;position:fixed;z-index:30;left:12px;right:12px;bottom:calc(12px + var(--safe-b));background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:0 12px 30px -12px rgba(28,43,36,.3)}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:14px;font-size:10.5px;font-weight:700;color:var(--muted)}
  .mnav button.on{background:var(--sage);color:var(--green)}
  .mnav svg{width:21px;height:21px}
  .modal{inset:0;left:0;top:0;width:100%;max-height:none;height:100%;border-radius:0;transform:translateY(100%);overflow:auto;display:block;scrollbar-width:none}
  .modal.open{transform:none}
  .m-img{height:auto;aspect-ratio:4/3.2}
  .m-img .close{top:calc(14px + var(--safe-t))}
  .m-body{display:block}
  .m-left{padding:24px 20px 10px;border-right:0;overflow:visible}

  .m-right{padding:22px 20px calc(24px + var(--safe-b));border-top:8px solid var(--paper2)}
  .feed{min-height:180px;max-height:none;overflow:visible}
  .composer{position:sticky;bottom:calc(10px + var(--safe-b));box-shadow:0 10px 30px -10px rgba(0,0,0,.25)}
}

/* ---- compact horizontal cards: one city per row ---- */
.grid{grid-template-columns:1fr!important;gap:12px!important}
.card{position:relative;flex-direction:row;align-items:stretch;border-radius:16px;min-height:128px}
.card:hover{transform:none}
.ph{width:118px;flex:none;aspect-ratio:auto;min-height:128px;border-radius:0}
.ph::after{background:linear-gradient(0deg,rgba(10,18,14,.25),transparent 45%)}
.ph .lv{top:8px;left:8px;font-size:9px;letter-spacing:1.2px;padding:4px 6px;border-radius:6px}

.card .go{display:inline-flex;align-items:center;gap:5px;flex:none;height:28px;padding:0 11px;border-radius:99px;background:var(--green);color:#fff;font-size:11.5px;font-weight:700}

.hero{aspect-ratio:1/1!important}

.hero p .lt{display:none}
.hero .btn{height:42px;font-size:13.5px}
.hero h2{font-size:30px!important}
.m-img{aspect-ratio:16/10!important}

<script>
/* elsewhere — web backend shim.
   When config.js provides a Supabase project, this recreates the small
   storage / live-room API the app uses, so the same index.html runs on
   Vercel (or any static host). Inside Claude it does nothing. */
(function(){
  const C = window.ELSEWHERE_CONFIG;
  if (window.claude || !C || !C.supabaseUrl || !C.supabaseAnonKey || /YOUR_/.test(C.supabaseUrl)) return;
  const ready = (async () => {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    const sb = createClient(C.supabaseUrl, C.supabaseAnonKey);
    let { data: { session } } = await sb.auth.getSession();
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; session = r.data.session; }
    const uid = session.user.id;
    let admin = false;
    try { const r = await sb.from("admins").select("user_id").eq("user_id", uid).maybeSingle(); admin = !!r.data; } catch (e) {}
    return { sb, uid, admin };
  })();
  ready.catch(e => console.warn("[elsewhere] backend unavailable:", e && e.message));

  const split = p => { const i = p.lastIndexOf("/"); return [p.slice(0, i), p.slice(i + 1)]; };
  const mkSnap = (id, data) => ({ id, exists: data != null, data: () => data == null ? undefined : data, metadata: { fromCache: false, hasPendingWrites: false } });
  const err = e => ({ code: /row-level|permission|violates/i.test(e && e.message || "") ? "invalid_argument" : "unavailable", message: e && e.message });

  function makeDb(ctx) {
    const { sb, uid } = ctx;
    const doc = path => {
      const [collection, doc_id] = split(path);
      return {
        id: doc_id, path,
        async get() { const r = await sb.from("kv").select("data").eq("path", path).maybeSingle(); if (r.error) throw err(r.error); return mkSnap(doc_id, r.data ? r.data.data : null); },
        async set(data) { const r = await sb.from("kv").upsert({ path, collection, doc_id, data, updated_at: new Date().toISOString() }); if (r.error) throw err(r.error); },
        async update(data) { const cur = await this.get(); if (!cur.exists) throw { code: "invalid_argument", message: "missing" }; return this.set(Object.assign({}, cur.data(), data)); },
        async delete() { const r = await sb.from("kv").delete().eq("path", path); if (r.error) throw err(r.error); }
      };
    };
    const collection = name => ({
      path: name,
      doc: id => doc(name + "/" + id),
      onSnapshot(next, onErr) {
        let alive = true;
        const load = async () => {
          const r = await sb.from("kv").select("doc_id,data").eq("collection", name).limit(5000);
          if (!alive) return;
          if (r.error) { onErr && onErr(err(r.error)); return; }
          const docs = r.data.map(x => mkSnap(x.doc_id, x.data));
          next({ docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } });
        };
        load();
        let t; const ch = sb.channel("kv-" + name + "-" + Math.random().toString(36).slice(2))
          .on("postgres_changes", { event: "*", schema: "public", table: "kv", filter: "collection=eq." + name }, () => { clearTimeout(t); t = setTimeout(load, 250); })
          .subscribe();
        const poll = setInterval(load, 30000);
        return () => { alive = false; clearInterval(poll); sb.removeChannel(ch); };
      }
    });
    return { doc, collection };
  }

  function makeRoom(ctx, name, peerId) {
    const { sb, uid } = ctx;
    const handlers = {}, peerHandlers = [], connHandlers = [];
    let state = {}, connected = false, peers = [];
    const ch = sb.channel("room-" + name, { config: { presence: { key: peerId }, broadcast: { self: true } } });
    ["chat", "react"].forEach(topic => ch.on("broadcast", { event: topic }, ({ payload }) => {
      const p = payload || {}; const m = { topic, data: p.data, by: p.by || null, peer: p.peer, isMe: p.peer === peerId, sameTab: p.peer === peerId, kind: "viewer", guest: false };
      (handlers[topic] || []).forEach(h => { try { h(m); } catch (e) {} });
    }));
    ch.on("presence", { event: "sync" }, () => {
      const st = ch.presenceState();
      peers = Object.entries(st).map(([k, arr]) => ({ peer: k, by: (arr[0] || {}).by || null, isMe: k === peerId, sameTab: k === peerId, kind: "viewer", guest: false, presence: arr[0] || {}, updatedAt: Date.now() }));
      peerHandlers.forEach(h => { try { h({ peers, joined: [], left: [], updated: [] }); } catch (e) {} });
    });
    ch.subscribe(status => { connected = status === "SUBSCRIBED"; if (connected) ch.track(Object.assign({ by: uid }, state)); connHandlers.forEach(h => h(connected)); });
    return {
      name,
      on(topic, h) { (handlers[topic] = handlers[topic] || []).push(h); return () => { handlers[topic] = handlers[topic].filter(x => x !== h); }; },
      async emit(topic, data) { await ch.send({ type: "broadcast", event: topic, payload: { data, by: uid, peer: peerId } }); },
      async presence(patch) { for (const k in patch) { if (patch[k] === null) delete state[k]; else state[k] = patch[k]; } if (connected) await ch.track(Object.assign({ by: uid }, state)); },
      peers: () => peers,
      onPeers(h) { peerHandlers.push(h); return () => {}; },
      connected: () => connected,
      onConnection(h) { connHandlers.push(h); setTimeout(() => h(connected)); return () => {}; },
      async leave() { await sb.removeChannel(ch); },
      async join(n) { return makeRoom(ctx, n, peerId); }
    };
  }

  const peerId = Math.random().toString(36).slice(2, 12);
  const cache = {};
  window.claude = {
    use: name => cache[name] || (cache[name] = ready.then(ctx => {
      if (name === "db") return makeDb(ctx);
      if (name === "room") return makeRoom(ctx, "lobby", peerId);
      if (name === "user") return { id: async () => ctx.uid, me: async () => ({ id: ctx.uid }), isOwner: () => ctx.admin, canEdit: () => ctx.admin, can: () => true, profiles: async () => ({}) };
      return null;
    }).catch(() => null))
  };
})();

/* time */
const fmt={};
function localTime(tz){try{return (fmt[tz]||(fmt[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit"}))).format(new Date());}catch(e){return "";}}
function localHour(tz){try{return +new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",hour12:false}).format(new Date())%24;}catch(e){return 12;}}
const partOfDay=tz=>{const h=localHour(tz);return h<5?"night":h<8?"early morning":h<12?"morning":h<17?"afternoon":h<20?"evening":"night";};

/* state */
const S={sort:"featured",view:"explore",q:"",cat:"all",cc:"all",group:"none",open:null,tab:"room",hero:0};
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem("el_saved")||"[]"));}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("el_saved",JSON.stringify([...saved]));}catch(e){}};
const LIKES={docs:new Map()};
function likeCount(id){let n=0;for(const [u,d] of LIKES.docs){if(u===SOC.uid)continue;if((d.ids||[]).includes(id))n++;}return n+(saved.has(id)?1:0);}
async function syncLike(){if(SOC.mode!=="shared"||!SOC.db||!SOC.uid||SOC.likeWriteOff)return;try{await queue(()=>SOC.db.doc("likes/"+SOC.uid).set({ids:[...saved].slice(0,500)}));}catch(e){if(e&&e.code==="invalid_argument")SOC.likeWriteOff=true;}}
const ADJ=["Coastal","Quiet","Wandering","Golden","Misty","Curious","Sunny","Velvet","Northern","Drifting","Gentle","Lunar","Amber","Alpine","Harbor","Midnight"];
const NOUN=["Traveler","Wanderer","Explorer","Drifter","Dreamer","Rover","Voyager","Nomad"];
const genHandle=()=>ADJ[Math.random()*ADJ.length|0]+" "+NOUN[Math.random()*NOUN.length|0]+" "+Math.random().toString(16).slice(2,6);
let HANDLE=(()=>{try{return localStorage.getItem("el_handle")||(h=>{localStorage.setItem("el_handle",h);return h;})(genHandle());}catch(e){return genHandle();}})();
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h;};
const av=h=>`<div class="av" style="background:hsl(${hue(h)} 30% 88%)">${esc(h[0]||"?")}</div>`;

/* ===================== social (comments + live room) ===================== */
const SOC={mode:"connecting",db:null,room:null,user:null,uid:null,owner:false,canWrite:true,canChat:true,comments:new Map(),reports:new Map(),here:{},chatRoom:null,chatLog:{},lastSend:0,muted:new Set(),hidden:new Set(),chatPeers:0};

const commentsFor=pid=>{const o=[];for(const [uid,d] of SOC.comments)(d.items||[]).forEach(it=>{if(it.pid===pid&&!SOC.hidden.has(uid+":"+it.id))o.push({...it,uid});});return o.sort((a,b)=>b.ts-a.ts);};

function filterOnly(){

  const p=BY_ID[S.open],f=$("#feed");if(!p||!f)return;let h="";
  if(S.tab==="notes"){
    if(SOC.mode==="local")h+=`<div class="notice">This copy runs on its own, so comments are saved on this device only.</div>`;
    else if(!SOC.canWrite)h+=`<div class="notice">You can read comments. To post, ask the owner for Contributor access.</div>`;
    const list=commentsFor(p.id);
    if(!list.length)h+=`<div class="e-state">${ic("chat")}<b>Leave the first comment.</b>Best time to watch? Something you spotted in ${esc(p.city)}?</div>`;
    h+=list.map(c=>{const mine=c.uid===SOC.uid;return `<div class="msg">${av(c.h||"?")}<div style="flex:1;min-width:0"><div class="who">${esc(c.h||"Traveler")}${mine?` <span class="you">YOU</span>`:""}<small>${ago(c.ts)}</small></div><p>${esc(c.text)}</p><div class="ops">${!mine?`<button data-report="${esc(c.uid)}|${esc(c.id)}">Report</button>`:""}${mine||SOC.owner?`<button data-del="${esc(c.uid)}|${esc(c.id)}">Delete</button>`:""}</div></div></div>`;}).join("");
  }else{
    const log=(SOC.chatLog[p.id]||[]).filter(m=>!SOC.muted.has(m.by));
    h+=`<div class="sys">${SOC.chatRoom?"You're in the live room · messages vanish when everyone leaves":(!SOC.room?"Live room works in the shared app — here messages only echo to you":SOC.chatErr?"The live room isn't available for your access level":"Joining the live room…")}</div>`;
    if(!log.length)h+=`<div class="e-state">${ic("chat")}<b>Be the first to say hello.</b>What caught your eye in ${esc(p.city)}?</div>`;
    h+=log.map((m,i)=>`<div class="msg">${av(m.h)}<div style="flex:1;min-width:0"><div class="who">${esc(m.h)}${m.mine?` <span class="you">YOU</span>`:""}<small>${ago(m.ts)}</small></div><p>${esc(m.t)}</p>${!m.mine?`<div class="ops"><button data-mute="${i}">Mute</button><button data-chatrep="${i}">Report</button></div>`:""}</div></div>`).join("");
    h+=`<div class="rhint"></div><div class="reacts">${REACTS.map(e=>`<button data-react="${e}">${e}<span class="rc"></span></button>`).join("")}</div>`;
  }
  f.innerHTML=h;paintReacts();
  if(stick){const m=$("#modal");m.scrollTop=m.scrollHeight;}
}
function renderComposer(){
  const c=$("#compose");if(!c)return;
  const dis=(S.tab==="notes"&&SOC.mode==="shared"&&!SOC.canWrite)||(S.tab==="room"&&!SOC.canChat);
  c.innerHTML=`<div class="composer"><input id="msg" maxlength="400" placeholder="${S.tab==="room"?"Say hello to fellow travelers…":"Leave a comment about this place…"}" ${dis?"disabled":""}><button class="send" id="sendBtn" ${dis?"disabled":""} aria-label="Send">${ic("send")}</button></div>`;
}
function ago(ts){const s=(Date.now()-ts)/1e3;return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago";}
function refreshLikes(){
  document.querySelectorAll("[data-fav]").forEach(b=>{const id=b.dataset.fav;if(b.classList.contains("heart"))b.classList.toggle("on",saved.has(id));else if(b.classList.contains("favbtn"))b.innerHTML=ic("heart")+(saved.has(id)?"Saved":"Save place")+` <span class="lc2" data-lc="${id}"></span>`;});
  document.querySelectorAll("[data-lc]").forEach(el=>{const n=likeCount(el.dataset.lc);el.textContent=el.classList.contains("lc2")?(n?"· "+n+" ♥":""):(n||"");});
  renderSide();if(S.view==="saved"&&!S.open)render();
}
function refreshCounts(){document.querySelectorAll("[data-meta]").forEach(el=>el.innerHTML=meta(el.dataset.meta));renderSide();}
function refreshHere(){if(!S.open)return;const n=Math.max(SOC.here[S.open]||0,SOC.chatPeers||0);const e=$("#hereN");if(e)e.textContent=n?n+" here":"";}
function refreshModal(){if(!S.open)return;const nn=$("#notesN");if(nn)nn.textContent=commentCount(S.open)||"";const m=$("#msg");const v=m?m.value:"",f=document.activeElement===m;renderFeed();renderComposer();const m2=$("#msg");if(m2){m2.value=v;if(f)m2.focus();}}
function refresh(){refreshCounts();refreshModal();}

/* sheets */
function sheet(h){$("#sheet").innerHTML=h;$("#sheet").classList.add("open");$("#sheetBg").classList.add("open");}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheetBg").classList.remove("open");}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600);}
const commonsUrl=f=>"https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));
function creditsSheet(){
  sheet(`<h3>Photo credits & source policy</h3>
  <p>Destination photos come from <b>Wikimedia Commons</b> under free licenses (CC BY, CC BY-SA, CC0, public domain and similar) and are shown as illustrations, not live frames. Each photo is credited below with its author and license.</p>
  <p>Live video is never hosted, recorded or re-broadcast here. “Watch live” links to the operator's own public stream on YouTube or their official site. Stream owners can ask the app owner to remove a link at any time.</p>
  ${PLACES.map(p=>{const c=CREDITS[p.id];return c?`<div class="cred"><b>${esc(p.name)}</b> — “${esc(c[0])}” by ${esc(c[2]||"unknown")}, <a href="${commonsUrl(c[0])}" target="_blank" rel="noopener noreferrer">${esc(c[1])}</a></div>`:"";}).join("")}
  <div style="margin-top:16px"><button class="btn dark" data-closesheet>Close</button></div>`);
}
function rulesSheet(){
  sheet(`<h3>Community rules</h3><ul>
  <li><b>Live room</b> is for people watching the same place right now. Messages aren't stored and vanish when everyone leaves.</li>
  <li><b>Comments</b> stay on a place — tips, best times to watch, what you spotted.</li>
  <li>Be kind. No harassment, hate or sexual content.</li>
  <li>Talk about the place, not the people on camera. Never try to identify or track anyone.</li>
  <li>Links, emails and phone numbers are blocked automatically.</li>
  <li>Use Report on anything that breaks the rules — it's hidden for you immediately.</li>
  <li>Your name here is anonymous. Comments store your nickname, text, time and an internal account ID so the owner can remove abuse.</li></ul>
  <button class="btn dark" data-closesheet>Got it</button>`);
}
function meSheet(){
  let rep="";
  if(SOC.owner){const r=[];for(const [u,d] of SOC.reports)(d.items||[]).forEach(x=>r.push({...x,rep:u}));r.sort((a,b)=>b.ts-a.ts);
    rep=`<h3 style="margin-top:18px">Moderation</h3>${r.length?r.slice(0,30).map(x=>`<div class="cred"><b>${esc(BY_ID[x.pid]?.name||x.pid)}</b> · ${esc(x.reason)}<br>“${esc(x.text)}” ${x.kind==="comment"&&x.uid?`<button class="btn line" style="height:30px;font-size:12px;margin-top:6px" data-moddel="${esc(x.uid)}|${esc(x.cid)}">Delete comment</button>`:""}</div>`).join(""):`<p>No reports.</p>`}`;}
  sheet(`<h3>You</h3><p>You are exploring as <b>${esc(HANDLE)}</b>.</p><button class="opt" data-rename>Change my anonymous name</button><button class="opt" data-view="saved">Saved places (${saved.size})</button><button class="opt" data-rules>Community rules</button><button class="opt" data-credits>Photo credits & source policy</button>${rep}`);
}
function countrySheet(){
  sheet(`<h3>Explore by country</h3><button class="opt" data-cc="all">🌍 All countries · ${PLACES.length}</button>${USED_CC.map(c=>`<button class="opt" data-cc="${c}">${esc(COUNTRIES[c])} <span style="float:right;color:var(--muted)">${PLACES.filter(p=>p.cc===c).length}</span></button>`).join("")}`);
}
function renameSheet(){sheet(`<h3>Your anonymous name</h3><p>Shown on your comments and messages. Don't use your real name.</p><input id="nameIn" maxlength="28" value="${esc(HANDLE)}"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn line" style="flex:1" data-randname>${ic("shuffle")}Random</button><button class="btn dark" style="flex:1" data-savename>Save</button></div>`);}
function reportSheet(kind,uid,cid,text){sheet(`<h3>Report this ${kind==="chat"?"message":"comment"}</h3><p>It'll be hidden for you right away and flagged for the owner.</p>${["Harassment or hate","Spam or ads","Sexual content","Personal info about someone","Other"].map(r=>`<button class="opt" data-reason="${r}">${r}</button>`).join("")}`);$("#sheet").dataset.rep=JSON.stringify({kind,uid,cid,text});}

/* ===================== events ===================== */
document.addEventListener("click",async e=>{
  if(e.target.id==="sheetBg"){closeSheet();return;}
  if(e.target.id==="ovl"){closePlace();return;}
  const t=e.target.closest("button,a,[data-open]");if(!t)return;const d=t.dataset;
  if(t.tagName==="A"&&t.getAttribute("href"))return;
  if(d.fav){e.stopPropagation();const id=d.fav;saved.has(id)?saved.delete(id):saved.add(id);saveFavs();syncLike();toast(saved.has(id)?"Saved — you love this place ♥":"Removed from saved");
    refreshLikes();renderSide();if(S.view==="saved"&&!S.open)render();return;}
  if(d.open){openPlace(d.open);return;}
  if("close" in d){closePlace();return;}
  if(d.view){closeSheet();if(S.open)closePlace();S.view=d.view;$("#scroller").scrollTop=0;render();document.querySelectorAll("#mnav button").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));return;}
  if(d.cat){S.cat=d.cat;render();return;}
  if(d.cc){closeSheet();S.cc=d.cc;S.view="explore";render();document.querySelector(".tools")?.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(d.hero!==undefined){S.hero=+d.hero;paintHero();startHero();return;}
  if("surprise" in d){const l=filtered();const p=(l.length?l:PLACES)[Math.random()*(l.length||PLACES.length)|0];openPlace(p.id);return;}
  if("clearq" in d){e.preventDefault();S.q="";render();$("#q")?.focus();return;}
  if(d.tab){S.tab=d.tab;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));renderFeed(S.tab==="room");renderComposer();return;}
  if(t.id==="sendBtn"){const m=$("#msg");const v=m.value;if(!v.trim())return;t.disabled=true;const ok=S.tab==="notes"?await postComment(S.open,v):await sendChat(S.open,v);const m2=$("#msg");if(ok&&m2)m2.value="";const b=$("#sendBtn");if(b)b.disabled=false;return;}
  if(d.react){const pid=S.open;if(RX.mine[pid]){toast(RX.mine[pid]===d.react?"You already reacted here":"Only one reaction per place");return;}
    RX.mine[pid]=d.react;syncReact();paintReacts();
    if(SOC.chatRoom&&SOC.canChat)SOC.chatRoom.emit("react",{e:d.react}).catch(()=>floaty(d.react,true));else floaty(d.react,true);return;}
  if(d.del){const [u,c]=d.del.split("|");delComment(u,c);return;}
  if(d.moddel){const [u,c]=d.moddel.split("|");await delComment(u,c);closeSheet();return;}
  if(d.report){const [u,c]=d.report.split("|");const it=(SOC.comments.get(u)?.items||[]).find(i=>i.id===c);reportSheet("comment",u,c,it?it.text:"");return;}
  if(d.mute!==undefined||d.chatrep!==undefined){const log=(SOC.chatLog[S.open]||[]).filter(m=>!SOC.muted.has(m.by));const m=log[+(d.mute??d.chatrep)];if(!m)return;
    if(d.mute!==undefined){SOC.muted.add(m.by);renderFeed();toast("Muted for this visit");}else reportSheet("chat",m.by,null,m.t);return;}
  if(d.reason){const r=JSON.parse($("#sheet").dataset.rep||"{}");closeSheet();report(r.kind,S.open,r.uid,r.cid,r.text||"",d.reason);return;}
  if("rename" in d){renameSheet();return;}
  if("randname" in d){$("#nameIn").value=genHandle();return;}
  if("savename" in d){const v=$("#nameIn").value.trim().replace(/[^\w\- ]/g,"").slice(0,28);if(v.length<2){toast("At least 2 characters");return;}HANDLE=v;try{localStorage.setItem("el_handle",v);}catch(e){}closeSheet();toast("Name updated");if(S.open)renderModal();return;}
  if("credits" in d){creditsSheet();return;}
  if("rules" in d){rulesSheet();return;}
  if("closesheet" in d){closeSheet();return;}
  if("me" in d){meSheet();return;}
  if("mcountry" in d){countrySheet();return;}
  if(d.copy){const url=((window.ELSEWHERE_CONFIG&&ELSEWHERE_CONFIG.siteUrl)||(/^https?:/.test(location.protocol)&&!/claudeusercontent|claude\.ai/.test(location.host)?location.origin+location.pathname:ARTIFACT_URL))+"#cam-"+d.copy;try{await navigator.clipboard.writeText(url);toast("Link copied");}catch(err){sheet(`<h3>Place link</h3><p>Copy this link:</p><input readonly value="${esc(url)}" onfocus="this.select()"><div style="margin-top:12px"><button class="btn dark" data-closesheet>Done</button></div>`);}return;}
});
let qt;
document.addEventListener("input",e=>{
  if(e.target.id==="q"){clearTimeout(qt);const v=e.target.value;$("#sbox")?.classList.toggle("has",!!v);qt=setTimeout(()=>{S.q=v;render();},180);}
});
document.addEventListener("change",e=>{
  if(e.target.id==="ccSel"){S.cc=e.target.value;render();}
  if(e.target.id==="grpSel"){S.group=e.target.value;render();}
  if(e.target.id==="sortSel"){S.sort=e.target.value;render();if(S.sort==="loved")toast("Sorted by how many travelers saved each place");}
});
document.addEventListener("keydown",e=>{
  if(e.target.id==="msg"&&e.key==="Enter"){e.preventDefault();$("#sendBtn")?.click();}
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.open&&e.target.classList.contains("card"))openPlace(e.target.dataset.open);
  if(e.key==="Escape"){if($("#sheet").classList.contains("open"))closeSheet();else if(S.open)closePlace();}
});
function onHash(){const h=(location.hash||"").slice(1);if(h.startsWith("cam-")){const id=h.slice(4);if(id!==S.open&&BY_ID[id])openPlace(id,true);}else if(S.open)closePlace(true);}
window.addEventListener("hashchange",onHash);
setInterval(()=>{document.querySelectorAll("[data-clock]").forEach(el=>{el.textContent=localTime(el.dataset.clock)+(el.dataset.suffix||"");});},20000);

render();startHero();onHash();initSocial();
</script>
</body>
